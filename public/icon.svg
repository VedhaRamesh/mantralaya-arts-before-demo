<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0A0D" />
      <stop offset="50%" stop-color="#581216" />
      <stop offset="100%" stop-color="#701A1E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E6" />
      <stop offset="25%" stop-color="#FDE68A" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#92400E" />
    </linearGradient>
    <linearGradient id="crimsonGoldGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="30%" stop-color="#FBBF24" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="outerPetalGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="40%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <circle cx="256" cy="235" r="215" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.35" stroke-dasharray="10 10" />

  <!-- Sacred Lotus Flower (Padma) Emblem -->
  <g transform="translate(256, 230) scale(3.5) translate(-50, -50)">
    <!-- 1. Base Padma Pedestal -->
    <path
      d="M26 82 C34 85 42 86 50 86 C58 86 66 85 74 82 C71 85 62 88 50 88 C38 88 29 85 26 82 Z"
      fill="url(#goldGrad)"
      opacity="0.85"
    />
    <path
      d="M32 86 C40 88 45 89 50 89 C55 89 60 88 68 86 C64 89 58 91 50 91 C42 91 36 89 32 86 Z"
      fill="url(#crimsonGoldGrad)"
      opacity="0.6"
    />

    <!-- 2. Lower Lateral Blooming Petals -->
    <path
      d="M50 78 C35 77 20 73 13 62 C18 59 28 61 38 68 C44 72 48 76 50 78 Z"
      fill="url(#goldGrad)"
      opacity="0.9"
    />
    <path
      d="M50 78 C65 77 80 73 87 62 C82 59 72 61 62 68 C56 72 52 76 50 78 Z"
      fill="url(#goldGrad)"
      opacity="0.9"
    />

    <!-- 3. Outer Mid Blooming Petals -->
    <path
      d="M50 77 C36 74 18 64 16 46 C24 44 34 50 42 62 C46 68 49 74 50 77 Z"
      fill="url(#outerPetalGrad)"
    />
    <path
      d="M50 77 C64 74 82 64 84 46 C76 44 66 50 58 62 C54 68 51 74 50 77 Z"
      fill="url(#outerPetalGrad)"
    />

    <!-- 4. Secondary Intermediate Petals -->
    <path
      d="M50 76 C40 72 26 58 30 32 C37 36 43 46 47 62 C49 68 50 73 50 76 Z"
      fill="url(#crimsonGoldGrad)"
    />
    <path
      d="M50 76 C60 72 74 58 70 32 C63 36 57 46 53 62 C51 68 50 73 50 76 Z"
      fill="url(#crimsonGoldGrad)"
    />

    <!-- 5. Inner Flanking Petals -->
    <path
      d="M50 75 C43 69 35 56 38 24 C44 32 48 44 50 62 C50 67 50 72 50 75 Z"
      fill="url(#goldGrad)"
    />
    <path
      d="M50 75 C57 69 65 56 62 24 C56 32 52 44 50 62 C50 67 50 72 50 75 Z"
      fill="url(#goldGrad)"
    />

    <!-- 6. Central Sacred Lotus Petal -->
    <path
      d="M50 14 C41 28 39 46 43 64 C45 71 48 75 50 76 C52 75 55 71 57 64 C61 46 59 28 50 14 Z"
      fill="url(#goldGrad)"
      stroke="#FEF08A"
      stroke-width="0.8"
    />

    <!-- 7. Inner Sacred Core Bud -->
    <path
      d="M50 24 C45 36 44 52 49 68 C50 71 50 73 50 73 C50 73 50 71 51 68 C56 52 55 36 50 24 Z"
      fill="url(#crimsonGoldGrad)"
      opacity="0.85"
    />

    <!-- Central spine line -->
    <line
      x1="50"
      y1="18"
      x2="50"
      y2="64"
      stroke="#FFFFFF"
      stroke-width="1"
      stroke-linecap="round"
      opacity="0.75"
    />

    <!-- 8. Golden Seed Pod / Bindu -->
    <circle cx="50" cy="74" r="3.2" fill="#FFFBEB" filter="url(#glow)" />
    <circle cx="50" cy="74" r="2" fill="#F59E0B" />
    <circle cx="44" cy="75" r="1.5" fill="#FDE68A" />
    <circle cx="56" cy="75" r="1.5" fill="#FDE68A" />
  </g>

  <!-- Mantralaya Arts Inscription -->
  <text x="256" y="445" font-family="'Cinzel', serif" font-weight="700" font-size="28" fill="#FDE68A" text-anchor="middle" letter-spacing="4">MANTRALAYA ARTS</text>
  <text x="256" y="475" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" fill="#E2D9CD" text-anchor="middle" letter-spacing="6">TEMPLE DEVOTIONAL POOJA</text>
</svg>
